plugins {
    id 'com.android.application'
}

android {
    namespace 'online.zytronix.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'online.zytronix.mobile'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            storeFile file('../signing/zytronix-test.jks')
            storePassword 'zytronix-test-2026'
            keyAlias 'zytronix-mobile'
            keyPassword 'zytronix-test-2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
